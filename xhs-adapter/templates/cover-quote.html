<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1080px; height: 1440px; background: #111; font-family: -apple-system, "PingFang SC", serif; color: #fff; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 120px; position: relative; }
  .quote-mark { font-size: 200px; color: rgba(255,107,107,0.15); position: absolute; top: 100px; left: 80px; font-family: Georgia, serif; }
  .quote { font-size: 52px; font-weight: 700; line-height: 1.6; text-align: center; position: relative; z-index: 1; }
  .quote .em { color: #ff6b6b; }
  .divider { width: 60px; height: 4px; background: #ffd93d; margin: 50px 0; border-radius: 2px; }
  .source { font-size: 24px; color: #888; }
  .source .name { color: #ccc; }
  .context { position: absolute; bottom: 120px; font-size: 20px; color: #555; text-align: center; line-height: 1.6; }
  .watermark { position: absolute; bottom: 40px; font-size: 18px; color: rgba(255,255,255,0.15); }
</style>
</head>
<body>
  <div class="quote-mark">"</div>
  <div class="quote">与其给三个人<span class="em">凑合坐</span><br>不如让两个人<span class="em">躺着</span></div>
  <div class="divider"></div>
  <div class="source">—— <span class="name">村长不开车</span></div>
  <div class="context">理想L8 从六座改五座<br>不是减配，是换赛道</div>
  <div class="watermark">村长不开车</div>
</body>
</html>
